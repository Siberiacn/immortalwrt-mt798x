name: Build ImmortalWrt N60

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/P3TERX/Actions-ImmortalWrt/main/general/depends-ubuntu-2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          
      - name: Update & Install Feeds
        run: |
          chmod +x scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Configuration
        run: |
          # 1. 核心硬件与 N60 定义
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_mt7986=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7986_DEVICE_netcore_n60=y" >> .config
          
          # 2. 补全 WiFi 6 核心驱动与微代码 (解决 WiFi 消失的根本)
          echo "CONFIG_PACKAGE_kmod-mt7986-firmware=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt798x-common=y" >> .config
          echo "CONFIG_PACKAGE_mt7986-wo-firmware=y" >> .config
          
          # 3. 完整 KVR 协议栈 (支持无缝漫游的关键)
          # 必须卸载精简版 wpad，安装全功能版以支持 802.11k/v/r
          echo "# CONFIG_PACKAGE_wpad-basic-openssl is not set" >> .config
          echo "CONFIG_PACKAGE_wpad-mesh-openssl=y" >> .config
          
          # 4. 漫游策略管理 (AP 组网必备)
          # usteer 是目前 ImmortalWrt 上实现多 AP 协同漫游最稳的方案
          echo "CONFIG_PACKAGE_luci-app-usteer=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-usteer-zh-cn=y" >> .config
          
          # 5. 纯 AP 瘦身与中文环境
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          # 移除不需要的拨号插件（AP 模式不需要）
          echo "# CONFIG_PACKAGE_luci-app-ppp is not set" >> .config
          
          make defconfig

      - name: Download package
        run: make download -j8

      - name: Compile the firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_N60_bin
          path: bin/targets/mediatek/mt7986/*.bin
